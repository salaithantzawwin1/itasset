{% for field in fields %}
<div class="form-row{% if field.errors %} errors{% endif %} field-{{ field.name }}">
  {{ field.errors }}
  <div>
    <div class="flex-container">
      <label for="{{ field.id_for_label }}">{{ field.label }}:{% if field.help_text %}<span class="help-tip" data-tip="{{ field.help_text }}" aria-label="{{ field.help_text }}" tabindex="0">i</span>{% endif %}</label>
      {{ field }}
    </div>
  </div>
</div>
{% endfor %}
