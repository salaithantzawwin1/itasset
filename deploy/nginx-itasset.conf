# Nginx site for IT Asset Manager (DEVELOPMENT.md §24 phase 1 — LAN HTTP).
# Install as /etc/nginx/sites-available/itasset → sites-enabled link.

server {
    listen 80;
    server_name 192.168.100.142;

    # must cover the app's 25 MB attachment cap (apps/attachments/models.py)
    # plus multipart overhead, or every large upload dies with 413 at nginx.
    client_max_body_size 30m;

    location /static/ {
        alias /home/glgadmin/itasset/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
