# Development databases only — app runs on the host (DEVELOPMENT.md §7)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: itasset
      POSTGRES_PASSWORD: itasset
      POSTGRES_DB: itasset
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itasset -d itasset"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
