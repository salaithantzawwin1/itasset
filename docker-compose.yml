# Production stack (DEVELOPMENT.md §24) — web + db + redis
services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_ENV: prod
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: itasset
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: itasset
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itasset -d itasset"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
