{% load t %}<!doctype html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Theme default = "auto"/system — the same three-mode contract as Django
    // admin's own theme.js (localStorage "theme": light|dark|auto).
    // Resolve before first paint so the app and the admin never disagree on
    // a fresh visit (dark OS → both dark; light OS → both light).
    (function () {
      var t = localStorage.getItem('theme') || 'auto';
      if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      // accent picked on the dashboard follows the user across every page
      var a = localStorage.getItem('accent');
      if (a) document.documentElement.setAttribute('data-accent', a);
    })();
  </script>
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>
  <style>
    :root {
      --primary: #0f4c81; --primary-dark: #0a355c; --primary-light: #e8f1fa;
      --accent: #2a9d8f; --danger: #c0392b; --warn-bg: #fdf0ee;
      --bg: #f4f6f9; --surface: #ffffff; --border: #e3e8ee;
      --text: #1f2d3d; --muted: #6b7a8d; --thead-bg: #f0f4f8;
      --shadow: 0 1px 3px rgba(16,42,67,.06);
      --radius: 10px;
    }
    [data-theme="dark"] {
      --primary: #4a90c8; --primary-dark: #0a355c; --primary-light: #16324a;
      --accent: #35b8a8; --danger: #e07060; --warn-bg: #3a2a28;
      --bg: #10161d; --surface: #1a222b; --border: #2a3441;
      --text: #e2e8f0; --muted: #8fa0b3; --thead-bg: #202b36;
    }
    /* ---------- accent palettes (site-wide) ---------- */
    /* Single source shared with registration/login.html and the admin theme;
       the <html data-accent> attribute is restored before first paint, so
       every page follows the dashboard choice. */
    {% include "partials/accent_palettes.css.html" %}
    /* white button text needs a deeper fill than the bright dark-mode accent;
       secondary buttons use a lighter ink so they stay readable on the tint */
    [data-theme="dark"] .btn { background: color-mix(in srgb, var(--primary) 78%, #000); }
    [data-theme="dark"] .btn:hover { filter: brightness(1.18); }
    [data-theme="dark"] .btn.secondary { color: color-mix(in srgb, var(--primary) 40%, #fff); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Myanmar Text", "Padauk", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; transition: background .2s, color .2s; }

    /* ---------- top navigation ---------- */
    .topbar { background: linear-gradient(90deg, var(--primary-dark), var(--primary)); color: #fff; padding: 0 28px; height: 58px; display: flex; align-items: center; gap: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.12); position: sticky; top: 0; z-index: 50; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .3px; color: #fff; text-decoration: none; }
    .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: #fff; overflow: hidden; flex: 0 0 auto; }
    .brand .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 2px; }
    .topnav { display: flex; gap: 4px; }
    .topnav a { color: rgba(255,255,255,.78); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; transition: all .15s; }
    .topnav a:hover { background: rgba(255,255,255,.12); color: #fff; }
    .topnav a.active { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
    .topbar .spacer { flex: 1; }
    .userbox { display: flex; align-items: center; gap: 10px; }
    .userbox .uname { color: rgba(255,255,255,.85); font-size: 13px; text-decoration: none; }
    .userbox a.uname:hover { color: #fff; text-decoration: underline; }
    .userbox form { margin: 0; display: inline; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .btn-ghost:hover { background: rgba(255,255,255,.14); }
    .toggle-theme { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1; }
    .toggle-theme:hover { background: rgba(255,255,255,.14); }
    .lang-switch { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; }
    .lang-switch button { background: transparent; color: rgba(255,255,255,.8); border: none; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 700; }
    .lang-switch button.on { background: rgba(255,255,255,.22); color: #fff; }

    /* ---------- page body ---------- */
    .page { max-width: 1180px; margin: 28px auto 60px; padding: 0 28px; }
    /* Big desktops (>=1440px): scale the container up so tables/charts use the
       screen instead of leaving ~370px dead gutters on each side (1920px).
       Laptop/tablet/mobile breakpoints below still govern below 1440px. */
    @media (min-width: 1440px) { .page { max-width: 1560px; padding: 0 36px; } }
    /* Ultrawide (3440px) / 4K (2560px+) tiers: keep growing the container so
       a 21:9 or 4K display doesn't frame a 1560px island in dead space. */
    @media (min-width: 1920px) { .page { max-width: 1880px; padding: 0 44px; } }
    @media (min-width: 2560px) { .page { max-width: 2480px; padding: 0 56px; } }
    @media (min-width: 3440px) { .page { max-width: 3312px; padding: 0 64px; } }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .page-head h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .page-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .page-head .actions { display: flex; gap: 8px; }

    /* ---------- cards / panels ---------- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 20px; }
    .card h2 { margin: 0 0 12px; font-size: 17px; }

    /* ---------- dashboard widgets ---------- */
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
    .stat .n { font-size: 30px; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .stat .lbl { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .bar-row .bl { width: 130px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row .bar { flex: 1; height: 12px; background: var(--primary-light); border-radius: 999px; overflow: hidden; }
    .bar-row .bar span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
    .bar-row .bn { width: 42px; text-align: right; font-size: 13px; font-weight: 700; }

    /* ---------- filter bar ---------- */
    /* One toolbar strip (shared by the assets list, audit log and attach
       pages): search + selects + checkboxes + actions grouped on a surface
       panel instead of floating loose on the page background. */
    .filterbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 11px 14px; }
    .filterbar input[type=text] { flex: 1 1 260px; max-width: 380px; }
    /* selects stay content-width — the width note on the shared form rule
       below explains why this used to lose and stack every dropdown */
    .filterbar select { width: auto; min-width: 170px; max-width: 100%; }
    .filterbar label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
    .filterbar input[type=checkbox] { width: auto; padding: 0; }
    /* applied filter: tint the control that is narrowing the list, so an
       active filter is visible without re-opening the dropdown */
    .filterbar select.on { border-color: var(--accent); font-weight: 600;
      background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .filterbar label.chk.on { color: var(--accent); font-weight: 600; }
    .filterbar .btn { margin-left: auto; }  /* Search + Clear hug the right edge */
    .filterbar .clear-link { font-size: 13px; text-decoration: none; }
    .filterbar .clear-link:hover { text-decoration: underline; }

    /* ---------- tables ---------- */
    /* overflow: clip (not hidden): hidden would make the table a scroll
       container and break the sticky header below — clip keeps corner
       rounding without one. `hidden` first is the fallback for engines
       without clip (Safari <16), where headers just don't stick. */
    table.data { border-collapse: separate; border-spacing: 0; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; overflow: clip; }
    table.data thead th { background: var(--thead-bg); text-align: left; padding: 10px 14px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--border); }
    /* Long tables (50-row asset list, history): keep column labels pinned
       under the sticky topbar while scrolling. Scoped above the phone
       breakpoint — at <=1024px .page becomes a scroll container, which
       would capture the stickiness anyway. */
    @media (min-width: 1025px) {
      table.data thead th { position: sticky; top: 58px; z-index: 3; box-shadow: 0 1px 0 var(--border); }
      /* Ultrawide (>=2560px): denser rows — more records per screen instead
         of one very tall, very sparse table. */
      @media (min-width: 2560px) {
        table.data thead th { padding-top: 8px; padding-bottom: 8px; }
        table.data tbody td { padding-top: 7px; padding-bottom: 7px; }
      }
    }
    table.data tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
    table.data tbody tr:last-child td { border-bottom: none; }
    table.data tbody tr:hover td { background: color-mix(in srgb, var(--primary) 4%, transparent); }
    table.data a { color: var(--primary); text-decoration: none; font-weight: 600; }
    table.data a:hover { text-decoration: underline; }
    .empty-row td { text-align: center; color: var(--muted); padding: 26px; font-style: italic; }

    /* ---------- badges ---------- */
    .pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .2px; }
    .pill-AVAILABLE { background: #e5f5ec; color: #1e7d43; } [data-theme="dark"] .pill-AVAILABLE { background: #143526; color: #6fd895; }
    .pill-ASSIGNED  { background: #e8f0fe; color: #2455a4; } [data-theme="dark"] .pill-ASSIGNED  { background: #16294a; color: #8ab4f8; }
    .pill-IN_STOCK  { background: #fdf6e3; color: #92702a; } [data-theme="dark"] .pill-IN_STOCK  { background: #37301a; color: #d8b95c; }
    .pill-IN_REPAIR { background: #fdeeee; color: #b03434; } [data-theme="dark"] .pill-IN_REPAIR { background: #3a2323; color: #ef9a9a; }
    .pill-IN_TRANSIT{ background: #eef0fd; color: #4c55b0; } [data-theme="dark"] .pill-IN_TRANSIT{ background: #232648; color: #a5aaf5; }
    .pill-RETIRED   { background: #ececec; color: #666; }    [data-theme="dark"] .pill-RETIRED   { background: #2b2b2b; color: #999; }
    .pill-DISPOSED  { background: #f0e2e2; color: #7c3a3a; } [data-theme="dark"] .pill-DISPOSED  { background: #3a2222; color: #c9998a; }
    /* one badge colour per category (Category.color, auto-assigned): a 15% tint
       of the colour in light theme, 26% in dark, with the text mixed towards
       black/white so every hue stays readable on both backgrounds */
    .cat-pill { background: color-mix(in srgb, var(--c, #64748b) 15%, transparent); color: color-mix(in srgb, var(--c, #64748b) 78%, #000); }
    [data-theme="dark"] .cat-pill { background: color-mix(in srgb, var(--c, #64748b) 26%, transparent); color: color-mix(in srgb, var(--c, #64748b) 62%, #fff); }

    /* ---------- buttons ---------- */
    .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent; background: var(--primary); color: #fff; text-decoration: none; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: filter .15s; }
    .btn:hover { filter: brightness(1.12); }
    .btn.secondary { background: var(--primary-light); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 25%, transparent); }
    .btn.danger { background: rgba(192,57,43,.10); color: var(--danger); border-color: rgba(192,57,43,.35); }
    .btn.sm { padding: 5px 11px; font-size: 12.5px; }

    /* ---------- forms ---------- */
    form.frm { max-width: 520px; }
    form.frm p { margin: 14px 0; }
    form.frm label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .3px; }
    form.frm input, form.frm select, form.frm textarea, .filterbar input, .filterbar select, form.inline-form select {
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 14px; color: var(--text);
    }
    /* width: 100% only where controls must fill their column. It used to
       ride along in the shared rule above — same specificity, later in the
       sheet than the filter bar's `width: auto` — so every filterbar select
       rendered full-width and wrapped onto its own row (the stacked
       dropdowns). The filter bar is flex; it sizes its own controls. */
    form.frm input, form.frm select, form.frm textarea, form.inline-form select { width: 100%; }
    form.frm input:focus, form.frm select:focus, form.frm textarea:focus, .filterbar input:focus, .filterbar select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent); }
    form.inline-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline-form select { width: auto; min-width: 210px; }
    .filterbar .btn { width: auto; }
    .errorlist { color: var(--danger); font-size: 13px; list-style: none; padding: 0; margin: 6px 0; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }

    /* ---------- misc ---------- */
    .muted { color: var(--muted); font-size: 13px; }
    .messages { list-style: none; padding: 0; margin: 0 0 16px; }
    .messages li { padding: 11px 16px; border-radius: 8px; font-size: 13.5px; margin-bottom: 8px; border: 1px solid; }
    .messages .success { background: #e5f5ec; color: #1e7d43; border-color: #bfe5cf; }
    .messages .error { background: #fdeeee; color: #b03434; border-color: #f2c8c8; }
    .pagination { display: flex; gap: 6px; margin-top: 16px; align-items: center; }
    .pagination a { padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--primary); text-decoration: none; font-size: 13px; }
    .pagination a:hover { background: var(--primary-light); }

    /* ---------- pipeline stepper (self-view request progress) ---------- */
    .steps { display: inline-flex; gap: 4px; align-items: center; }
    .steps .step { width: 19px; height: 19px; border-radius: 50%; font-size: 10px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--primary-light); color: var(--muted); border: 1px solid var(--border); }
    .steps .step.done { background: var(--primary); color: #fff; border-color: var(--primary); }
    .steps .step.current { background: #f59e0b; color: #fff; border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,.25); }
    .steps .step.failed { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* ---------- responsive (there were no @media rules at all) ---------- */
    .brand .bname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 1024px) {
      .topbar { height: auto; min-height: 58px; flex-wrap: wrap; padding: 8px 16px; row-gap: 6px; }
      .topbar .spacer { display: none; }
      .userbox { margin-left: auto; }
      .topnav { flex-wrap: wrap; gap: 2px; }
      .page { margin-top: 18px; padding: 0 16px; overflow-x: auto; }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 6px 10px; gap: 8px; }
      .brand { font-size: 14px; }
      .brand .logo { width: 26px; height: 26px; font-size: 13px; }
      .topnav a { padding: 6px 9px; font-size: 13px; }
      .userbox .uname { display: none; }
      .page { padding: 0 10px; }
      .page-head h1 { font-size: 19px; }
      /* Phone: action buttons share the row instead of shrink-wrapping to
         unreadable slivers ("+ New asset" used to break over three lines). */
      .page-head .actions { width: 100%; flex-wrap: wrap; }
      .page-head .actions .btn { flex: 1 1 40%; text-align: center; }
      .page-head .actions .btn.secondary { flex: 1 1 40%; }
      .card { padding: 16px 14px; }
      form.frm { max-width: 100%; }
      .filterbar input[type=text] { max-width: none; }
    }
    /* ---------- phone (<=480px): touch targets & single-column forms ---------- */
    @media (max-width: 480px) {
      /* 44px = the iOS/Android comfortable tap target (HIG/WCAG 2.5.5) */
      .btn { padding: 12px 16px; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      .btn.sm { padding: 10px 14px; min-height: 40px; }
      .topnav a, .btn-ghost, .toggle-theme, .lang-switch button { min-height: 44px; display: inline-flex; align-items: center; }
      /* every control on its own line, big enough to hit without zooming */
      .filterbar { gap: 8px; }
      .filterbar input[type=text], .filterbar select { flex: 1 1 100%; max-width: none; min-height: 44px; width: 100%; }
      .filterbar label.chk { min-height: 44px; }
      .filterbar .btn { width: 100%; }
      form.frm input, form.frm select, form.frm textarea, form.inline-form select { min-height: 44px; font-size: 16px; /* 16px stops iOS auto-zoom on focus */ }
      form.frm label { font-size: 12px; }
      .inline-form { width: 100%; }
      .inline-form select { flex: 1 1 100%; min-width: 0; width: 100%; }
      .inline-form .btn { width: 100%; }
      /* tab strips scroll horizontally instead of squeezing to 2px taps */
      .ftabs { flex-wrap: nowrap !important; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .ftabs::-webkit-scrollbar { display: none; }
      .ftab { white-space: nowrap; min-height: 44px; padding: 12px 14px; }
      .page-head .actions { width: 100%; flex-wrap: wrap; }
      .page-head .actions .btn { flex: 1 1 40%; }
      .pagination a { min-height: 44px; display: inline-flex; align-items: center; }
      table.data thead th, table.data tbody td { padding: 9px 10px; }
    }

    /* =====================================================================
       v3 workspace redesign
       A calmer, denser admin surface: dark navigation rail, light canvas,
       clear page hierarchy, softer cards and one consistent table/form
       language. Existing component classes are preserved so every page
       inherits the skin without being rewritten.
       ===================================================================== */
    :root {
      --primary: #1d4ed8; --primary-dark: #0f2a63; --primary-light: #eef4ff;
      --accent: #0e9f9a; --danger: #dc4c3f; --warn-bg: #fff7ed;
      --bg: #f5f7fb; --surface: #ffffff; --border: #e3e9f3;
      --text: #0f1b2d; --muted: #66758c; --thead-bg: #f7f9fd;
      --shadow: 0 1px 2px rgba(15, 35, 65, .04), 0 8px 24px rgba(15, 35, 65, .04);
      --radius: 14px;
      --side-bg: #0b1424; --side-bg-2: #101d32; --side-w: 260px;
      --topbar-h: 68px;
    }
    [data-theme="dark"] {
      --primary: #6fa8ff; --primary-dark: #0a1a33; --primary-light: #16243a;
      --accent: #2dd4bf; --danger: #f28b82; --warn-bg: #2e2317;
      --bg: #0c121c; --surface: #141d2b; --border: #263244;
      --text: #e6edf7; --muted: #93a4ba; --thead-bg: #182334;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.22);
      --side-bg: #070c16; --side-bg-2: #0c1626;
    }
    body { font-family: "Inter", "Segoe UI", system-ui, "Myanmar Text", "Padauk", sans-serif;
      background: radial-gradient(1100px 520px at 8% -12%, color-mix(in srgb, var(--primary) 8%, transparent), transparent 62%),
                  radial-gradient(900px 450px at 100% 0%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 58%),
                  var(--bg);
      background-attachment: fixed; line-height: 1.5; -webkit-font-smoothing: antialiased; }

    /* ---------- dark navigation rail ---------- */
    .app-shell { --shell: 1; }
    .app-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 70; width: var(--side-w);
      display: flex; flex-direction: column; gap: 8px; padding: 22px 16px 18px;
      background: linear-gradient(180deg, var(--side-bg), var(--side-bg-2)); color: #dbe5f3;
      border-right: 1px solid rgba(255,255,255,.07); box-shadow: 18px 0 48px rgba(4, 11, 22, .12); }
    .side-brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px;
      text-decoration: none; color: #fff; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 8px; }
    .side-logo { width: 38px; height: 38px; border-radius: 12px; flex: 0 0 auto; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
      color: #fff; background: linear-gradient(135deg, #2563eb, #14b8a6); box-shadow: 0 6px 16px rgba(37,99,235,.35); }
    .side-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 3px; }
    .side-brand-text { min-width: 0; display: flex; flex-direction: column; }
    .side-brand-text strong { font-size: 14px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side-brand-text small { color: #8fa3bd; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
    .side-nav { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; scrollbar-width: thin; }
    .side-label { margin: 16px 10px 6px; color: #7186a1; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .side-label:first-child { margin-top: 4px; }
    .side-link { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 10px;
      color: #a9b8cc; text-decoration: none; font-size: 13.5px; font-weight: 550; position: relative;
      transition: background .15s ease, color .15s ease, transform .15s ease; }
    .side-link svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .8; }
    .side-link:hover { background: rgba(255,255,255,.06); color: #fff; }
    .side-link.active { color: #fff; background: linear-gradient(90deg, rgba(37,99,235,.34), rgba(20,184,166,.10)); box-shadow: inset 3px 0 0 #38bdf8; }
    .side-link.active svg { opacity: 1; color: #7dd3fc; }
    .side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 8px; }
    .side-user { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #dbe5f3; padding: 5px; border-radius: 10px; }
    .side-user:hover { background: rgba(255,255,255,.06); }
    .side-avatar { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.10); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: 0 0 auto; }
    .side-user-text { min-width: 0; display: flex; flex-direction: column; }
    .side-user-text strong { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-user-text small { color: #8195ae; font-size: 10.5px; }
    .side-logout { background: transparent; border: 1px solid rgba(255,255,255,.13); color: #a9b8cc; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .side-logout:hover { color: #fff; border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.07); }
    .side-logout svg { width: 16px; height: 16px; }
    .sidebar-scrim { position: fixed; inset: 0; z-index: 65; background: rgba(3, 9, 18, .55); backdrop-filter: blur(2px); border: 0; }

    /* ---------- top utility bar ---------- */
    .app-shell .topbar { margin-left: var(--side-w); height: var(--topbar-h); padding: 0 30px;
      background: color-mix(in srgb, var(--surface) 86%, transparent); color: var(--text);
      border-bottom: 1px solid var(--border); box-shadow: none; backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px); top: 0; }
    .app-shell .topbar .brand, .app-shell .topnav { display: none; }
    .app-shell .quick-search { display: flex; align-items: center; gap: 9px; width: min(420px, 38vw);
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; color: var(--muted); }
    .app-shell .quick-search svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .app-shell .quick-search input { border: 0; background: transparent; padding: 0; font-size: 13px; color: var(--text); width: 100%; outline: none; }
    .app-shell .quick-search input::placeholder { color: var(--muted); }
    .app-shell .quick-search kbd { font: inherit; font-size: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: 1px 5px; border-radius: 5px; }
    .app-shell .userbox .uname { color: var(--muted); font-weight: 600; }
    .app-shell .userbox a.uname:hover { color: var(--primary); }
    @media (min-width: 1025px) {
      /* the rail owns identity + logout on desktop; the utility bar keeps
         language, theme and search only */
      .app-shell .userbox .uname, .app-shell .topbar-logout { display: none; }
    }
    .app-shell .btn-ghost { color: var(--text); border-color: var(--border); background: var(--surface); }
    .app-shell .btn-ghost:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .app-shell .toggle-theme { color: var(--muted); border-color: var(--border); background: var(--surface); }
    .app-shell .toggle-theme:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }
    .app-shell .lang-switch { border-color: var(--border); background: var(--surface); }
    .app-shell .lang-switch button { color: var(--muted); }
    .app-shell .lang-switch button.on { background: var(--primary); color: #fff; }
    .nav-burger { display: none; background: transparent; border: 0; padding: 7px; cursor: pointer; }
    .nav-burger span { display: block; width: 18px; height: 2px; margin: 4px 0; background: var(--text); border-radius: 2px; }

    /* ---------- canvas + hierarchy ---------- */
    .app-shell .page { max-width: 1720px; margin: 0 auto 64px var(--side-w); padding: 30px clamp(20px, 3vw, 44px) 24px; }
    .app-shell .page-head { align-items: flex-end; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .page-head h1 { font-size: clamp(22px, 2vw, 28px); letter-spacing: -.025em; line-height: 1.2; }
    .page-head .sub { font-size: 13px; margin-top: 5px; }
    .eyebrow { display: block; color: var(--primary); font-size: 10.5px; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }

    /* ---------- cards ---------- */
    .card { border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow); border-color: var(--border); }
    .card > h2 { font-size: 15px; letter-spacing: -.01em; margin-bottom: 14px; }
    .card > h2:first-child { margin-top: 0; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .table-wrap table.data { border: 0; border-radius: 0; }

    /* ---------- tables ---------- */
    table.data { border-radius: 12px; box-shadow: 0 1px 2px rgba(15,35,65,.03); }
    table.data thead th { padding: 11px 14px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--muted);
      background: var(--thead-bg); border-bottom: 1px solid var(--border); }
    table.data tbody td { padding: 13px 14px; border-bottom: 1px solid color-mix(in srgb, var(--border) 75%, transparent); }
    table.data tbody tr:last-child td { border-bottom: 0; }
    table.data tbody tr:hover td { background: color-mix(in srgb, var(--primary) 3.5%, transparent); }
    table.data a { font-weight: 650; }
    .cell-note { color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 2px; white-space: nowrap; }

    /* ---------- buttons ---------- */
    .btn { border-radius: 10px; padding: 9px 16px; font-weight: 650; letter-spacing: .005em;
      box-shadow: 0 1px 2px rgba(15,35,65,.10); }
    .btn:hover { filter: none; background: color-mix(in srgb, var(--primary) 88%, #000); transform: translateY(-1px); }
    .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: none; }
    .btn.secondary:hover { background: var(--primary-light); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
    .btn.danger { background: color-mix(in srgb, var(--danger) 8%, var(--surface)); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--border)); box-shadow: none; }
    .btn.danger:hover { background: var(--danger); color: #fff; }
    .btn.sm { padding: 6px 11px; font-size: 12px; }

    /* ---------- forms ---------- */
    form.frm label { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    form.frm input, form.frm select, form.frm textarea, .filterbar input, .filterbar select, form.inline-form select {
      border-radius: 10px; border-color: var(--border); background: var(--surface); padding: 10px 12px; transition: border-color .15s, box-shadow .15s; }
    form.frm input:focus, form.frm select:focus, form.frm textarea:focus, .filterbar input:focus, .filterbar select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 12%, transparent); }
    form.frm p { margin: 15px 0; }
    .filterbar { border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }

    /* ---------- feedback ---------- */
    .messages li { display: flex; align-items: flex-start; gap: 10px; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(15,35,65,.04); }
    .messages li span { flex: 1; }
    .msg-x { border: 0; background: transparent; color: inherit; opacity: .55; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .msg-x:hover { opacity: 1; }
    .messages .warning { background: #fff8e8; color: #8a5a12; border-color: #f2d9a8; }
    .messages .info { background: var(--primary-light); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 22%, transparent); }
    [data-theme="dark"] .messages .warning { background: #332816; color: #f1c77a; border-color: #4d3c20; }
    .notice { border-radius: 12px; padding: 13px 16px; margin: 0 0 16px; font-size: 13px; border: 1px solid; line-height: 1.55; }
    .notice-warn { background: #fff8e8; border-color: #f2d9a8; color: #7c5210; }
    [data-theme="dark"] .notice-warn { background: #2e2517; border-color: #4b3b21; color: #f0c97f; }
    .check-card { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 14px 16px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 13px; }
    .check-card input { width: auto; margin-top: 3px; }
    .check-card:hover { border-color: var(--primary); }
    .check-card.needs-attention { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,.14); }
    .row-cross-site td { background: color-mix(in srgb, #f59e0b 5%, transparent); }
    .pill-move { background: #fff3d6; color: #946200; white-space: nowrap; }
    [data-theme="dark"] .pill-move { background: #3a2f18; color: #f0c97f; }
    .ram-layout { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: -2px 0 14px;
      border: 1px solid color-mix(in srgb, var(--primary) 18%, var(--border)); border-radius: 12px; background: var(--primary-light); }
    .ram-layout-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
    .ram-layout .eyebrow { margin-bottom: 2px; }
    .ram-layout strong { display: block; font-size: 14px; }

    /* ---------- asset identity strip ---------- */
    .asset-summary { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: linear-gradient(120deg, var(--surface), color-mix(in srgb, var(--primary) 4%, var(--surface)));
      border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .asset-icon { width: 48px; height: 48px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .asset-summary .asset-main { min-width: 180px; flex: 1; }
    .asset-summary .asset-main strong { display: block; font-size: 16px; }
    .asset-summary .asset-main small { color: var(--muted); }
    .summary-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .summary-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .summary-chip strong { color: var(--text); font-weight: 650; }

    /* ---------- responsive shell ---------- */
    @media (max-width: 1024px) {
      .app-shell .topbar { margin-left: 0; padding: 8px 14px; min-height: 58px; height: auto; }
      .app-shell .page { margin-left: 0; padding: 20px 16px 36px; }
      .app-shell .nav-burger { display: block; }
      .app-shell .topbar .brand { display: flex; }
      .app-shell .topbar .brand .logo { width: 28px; height: 28px; }
      .app-shell .quick-search { width: min(300px, 40vw); }
      .app-sidebar { transform: translateX(-102%); transition: transform .22s cubic-bezier(.2,.8,.3,1); width: min(300px, 84vw); }
      body.nav-open .app-sidebar { transform: translateX(0); }
      body.nav-open { overflow: hidden; }
    }
    @media (max-width: 640px) {
      .app-shell .topbar .brand .bname { display: none; }
      .app-shell .topbar { gap: 8px; }
      .app-shell .dash-hero { flex-direction: column; align-items: flex-start; padding: 22px; gap: 16px; }
      .app-shell .dash-hero .hero-actions { width: 100%; justify-content: flex-start; }
      .app-shell .dash-hero .hero-cta { flex: 0 1 auto; white-space: nowrap; }
    }
    @media (max-width: 760px) {
      .app-shell .quick-search { display: none; }
      .app-shell .topbar .spacer { display: block; flex: 1; }
      .app-shell .page-head { align-items: flex-start; }
      .app-shell .page-head .actions { width: 100%; flex-wrap: wrap; }
      .asset-summary { padding: 15px 16px; }
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body class="app-shell">
  {% include "partials/topbar.html" %}
  {% include "partials/app_sidebar.html" %}
  <div class="page">
    {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}"><span>{{ m }}</span><button type="button" class="msg-x" aria-label="Dismiss">&times;</button></li>{% endfor %}</ul>{% endif %}
    {% block content %}{% endblock %}
  </div>
  <script>
    // mobile navigation drawer
    (function () {
      var btn = document.getElementById('nav-burger');
      var side = document.getElementById('app-sidebar');
      var scrim = document.getElementById('sidebar-scrim');
      if (!btn || !side) return;
      function setOpen(open) {
        document.body.classList.toggle('nav-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (scrim) scrim.hidden = !open;
      }
      btn.addEventListener('click', function () { setOpen(!document.body.classList.contains('nav-open')); });
      if (scrim) scrim.addEventListener('click', function () { setOpen(false); });
      side.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.body.classList.contains('nav-open')) setOpen(false);
      });
      var mq = window.matchMedia('(min-width: 1025px)');
      if (mq.addEventListener) mq.addEventListener('change', function (e) { if (e.matches) setOpen(false); });
    })();
    // “/” focuses the global asset search, like most admin tools
    (function () {
      var q = document.querySelector('.quick-search input');
      if (!q) return;
      document.addEventListener('keydown', function (e) {
        if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
        var t = e.target;
        if (t && (t.matches('input, textarea, select') || t.isContentEditable)) return;
        e.preventDefault(); q.focus(); q.select();
      });
    })();
    // dismissable flash messages
    document.querySelectorAll('.msg-x').forEach(function (b) {
      b.addEventListener('click', function () { var li = b.closest('li'); if (li) li.remove(); });
    });
    // language switch: submit the hidden form
    function setLang(l) { document.getElementById('langval').value = l; document.getElementById('langval').form.submit(); }
    // highlight active lang button (server session is authoritative; default eng)
    (function() {
      var cur = "{{ request.session.lang|default:'en' }}";
      document.getElementById('btn-en').className = (cur === 'en') ? 'on' : '';
      document.getElementById('btn-my').className = (cur === 'my') ? 'on' : '';
    })();
    // theme: light | dark | auto(system) — same three states as the Django
    // admin theme.js; a missing key defaults to auto/system.
    (function() {
      var ORDER = ['light', 'dark', 'auto'];
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function resolve(t) { return t === 'auto' ? (mq.matches ? 'dark' : 'light') : t; }
      function apply() {
        document.documentElement.setAttribute('data-theme', resolve(localStorage.getItem('theme') || 'auto'));
      }
      apply();
      // "auto" follows the OS live, exactly like the admin's dark-mode CSS
      if (mq.addEventListener) mq.addEventListener('change', apply);
      else if (mq.addListener) mq.addListener(apply);
      document.getElementById('btn-theme').addEventListener('click', function() {
        var cur = localStorage.getItem('theme') || 'auto';
        var next = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length];
        localStorage.setItem('theme', next);
        apply();
      });
    })();
  </script>
  {% include "partials/modal.html" %}
</body>
</html>
